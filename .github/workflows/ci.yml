name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint with ruff
        run: ruff check src tests bench
      - name: Typecheck with mypy
        run: mypy src bench
      - name: Run tests with coverage
        run: pytest --cov=donegate --cov-fail-under=85

  wheel-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Install wheel in clean venv and smoke-test all 8 language profiles
        run: |
          python -m venv /tmp/smoke-venv
          /tmp/smoke-venv/bin/pip install dist/*.whl
          python - <<'EOF'
          import subprocess, tempfile
          from pathlib import Path

          markers = {
              "python": "pyproject.toml",
              "node": "package.json",
              "go": "go.mod",
              "rust": "Cargo.toml",
              "java": "pom.xml",
              "dotnet": "App.csproj",
              "ruby": "Gemfile",
              "php": "composer.json",
              "elixir": "mix.exs",
              "scala": "build.sbt",
              "swift": "Package.swift",
              "zig": "build.zig",
              "cpp": "CMakeLists.txt",
          }
          dg = "/tmp/smoke-venv/bin/donegate"
          for lang, marker in markers.items():
              with tempfile.TemporaryDirectory() as d:
                  p = Path(d)
                  (p / marker).write_text("", encoding="utf-8")
                  subprocess.run(["git", "init"], cwd=d, check=True)
                  subprocess.run([dg, "init", "--json"], cwd=d, check=True)
                  subprocess.run([dg, "doctor", "--json"], cwd=d, check=True)
          EOF
