version: "1"
goal: "Fix Mix test and Credo lint in Elixir project"
language_profile: elixir
tasks:
  - id: elixir-task
    title: "Implement fix and pass mix test"
    scope:
      allow: ["lib/**/*.ex", "test/**/*.exs"]
    budget:
      steps: 10
      minutes: 15
    checks:
      - type: test_suite
        command: "mix test"
        parser: generic
      - type: lint_clean
        command: "mix credo --strict"
