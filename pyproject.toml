[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "donegate"
dynamic = ["version"]
description = "CI for AI agents: executable contracts, scope guards, budgets, and language-agnostic checks."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
  { name = "sagar04-cloud" },
]
keywords = ["ai", "agents", "ci", "testing", "guardrails", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "pydantic>=2.5,<3.0",
  "typer>=0.12,<1.0",
  "rich>=13.7,<15.0",
  "pyyaml>=6.0,<7.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.4",
  "mypy>=1.10",
  "types-PyYAML>=6.0",
  "build>=1.2",
]

[project.urls]
Homepage = "https://github.com/sagar04-cloud/CI-for-AI-agents"
Repository = "https://github.com/sagar04-cloud/CI-for-AI-agents"
Issues = "https://github.com/sagar04-cloud/CI-for-AI-agents/issues"

[project.scripts]
donegate = "donegate.cli:app"

[tool.setuptools.dynamic]
version = { attr = "donegate.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
donegate = ["py.typed", "profiles/data/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.coverage.run]
source = ["src/donegate"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_configs = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["yaml.*"]
ignore_missing_imports = true
